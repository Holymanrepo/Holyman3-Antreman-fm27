name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build FM27 Trainer (Release)
        shell: pwsh
        run: |
          cargo build --release -p fm27-trainer
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fm27-trainer.exe "dist/FM27.Trainer.exe"
          Copy-Item target/release/fm27-trainer.exe "dist/FM27 Trainer.exe"
          Compress-Archive -Path "dist/FM27 Trainer.exe" -DestinationPath "dist/FM27-Trainer-Windows.zip" -Force
          Remove-Item "dist/FM27 Trainer.exe" -Force

      - name: Build Smart Setup.exe (Bundled + Language Selector)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $icon = "app\assets\icon\app.ico"
          $logo = "app\assets\icon\icon_256.png"
          $resArg = "/resource:dist\FM27.Trainer.exe,FM27Trainer.exe"
          $logoArg = "/resource:$logo,logo.png"
          if (Test-Path $icon) {
            & $csc /target:winexe /out:"dist\FM27.Trainer.Setup.exe" "/win32icon:$icon" $resArg $logoArg "installer\Setup.cs"
          } else {
            & $csc /target:winexe /out:"dist\FM27.Trainer.Setup.exe" $resArg $logoArg "installer\Setup.cs"
          }
          Get-ChildItem dist

      - name: Upload unsigned Setup artifact for SignPath
        id: setup_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: dist/FM27.Trainer.Setup.exe
          if-no-files-found: error

      - name: SignPath Code Signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Holyman3-Antreman-fm27
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.setup_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace Setup with signed binary
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed/*Setup.exe dist/ -Force

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/FM27.Trainer.exe
            dist/FM27.Trainer.Setup.exe
            dist/FM27-Trainer-Windows.zip
